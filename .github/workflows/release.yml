name: Release deb

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build a .deb for (e.g. v0.7.2)"
        required: true

permissions:
  contents: write

jobs:
  deb:
    # debian:12 (glibc 2.36) keeps the binary installable on Debian stable;
    # a plain ubuntu-latest build would link glibc 2.39.
    runs-on: ubuntu-latest
    container: debian:12
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential git gh

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

      - name: Build .deb
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-deb --locked
          cargo deb

      - name: Check package version matches the tag
        run: |
          deb=$(ls target/debian/*.deb)
          ver=$(dpkg-deb -f "$deb" Version)
          case "$ver" in
            "${TAG#v}"*) echo "$deb version $ver matches $TAG" ;;
            *) echo "package version $ver does not match tag $TAG"; exit 1 ;;
          esac

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh otherwise asks git for the repo, and git refuses the
          # runner-owned workspace inside the container
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" target/debian/*.deb --clobber

  rpm:
    # fedora:41 keeps the binary installable on the still-supported Fedora
    # releases; a newer container would raise the glibc floor.
    runs-on: ubuntu-latest
    container: fedora:41
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Install build dependencies
        # rpm-build provides find-requires, which cargo-generate-rpm's auto-req
        # uses to resolve the glibc/gcc-libs dependencies.
        run: dnf install -y gcc git gh rpm-build

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

      - name: Build .rpm
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-generate-rpm --locked
          cargo build --release
          cargo generate-rpm

      - name: Check package version matches the tag
        run: |
          rpm=$(ls target/generate-rpm/*.rpm)
          ver=$(rpm -qp --queryformat '%{VERSION}' "$rpm")
          case "$ver" in
            "${TAG#v}") echo "$rpm version $ver matches $TAG" ;;
            *) echo "package version $ver does not match tag $TAG"; exit 1 ;;
          esac

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" target/generate-rpm/*.rpm --clobber
